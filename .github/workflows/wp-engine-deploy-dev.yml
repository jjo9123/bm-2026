name: Deploy to Development Env on WP Engine

on:
  workflow_dispatch:
  push:
    branches:
      - dev

jobs:
  deploy-code-dev:
    name: Deploy Code to Development
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Deploy Custom Code Inside wp-content Directory to Development Environment on WP Engine
        uses: wpengine/github-action-wpe-site-deploy@v3
        with:
          # Deploy vars
          WPE_SSHG_KEY_PRIVATE: ${{ secrets.WPE_SSHG_KEY_PRIVATE }}
          WPE_ENV: ${{ vars.WPE_ENV_DEVELOPMENT }}

          # Deploy Options
          SRC_PATH: "wp-content/"
          REMOTE_PATH: "wp-content/"
          PHP_LINT: TRUE
          CACHE_CLEAR: TRUE